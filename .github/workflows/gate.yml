name: gate
on: [push, pull_request]
jobs:
  witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: tests (codec, signed envelope, edge verdict, mesh integration, image/survival, chunk)
        run: node --test spore-card.test.mjs envelope.test.mjs edge.test.mjs mesh.test.mjs spore-card-image.test.mjs
      - name: mutation gate (codec + envelope + edge verdict)
        run: node witness-all.mjs
      - name: the edge-verify done-test re-runs and must reproduce the committed receipt byte for byte
        run: node tools/edge-receipt.mjs --check
